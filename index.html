<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- 強制瀏覽器不快取，確保拿到最新代碼 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <meta name="referrer" content="no-referrer">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="髒亂點巡檢">
    <meta name="theme-color" content="#020617">
    
    <link rel="manifest" id="dynamic-manifest">

    <title>115年南投縣髒亂點巡查系統</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #020617;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #map {
            height: 100%;
            width: 100%;
            background: #020617;
        }

        /* 導覽列與安全區域 */
        header {
            padding-top: max(1rem, env(safe-area-inset-top));
        }

        /* 底部安全區域 */
        #detail-panel {
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }

        /* Leaflet 樣式自訂 */
        .leaflet-vml-container, .leaflet-control-container {
            display: none !important;
        }
        
        /* 使用者定位點樣式 */
        .custom-user-icon {
            background: none;
            border: none;
        }
        .user-location-marker {
            width: 16px;
            height: 16px;
            background: #38bdf8;
            border: 2.5px solid #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }
        .user-pulse {
            position: absolute;
            width: 40px;
            height: 40px;
            left: -12px;
            top: -12px;
            background: rgba(56, 189, 248, 0.25);
            border-radius: 50%;
            animation: pulse 2s infinite ease-out;
            pointer-events: none;
        }
        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* 側邊抽屜動畫 */
        .drawer-transition {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="overflow-hidden h-screen flex flex-col text-slate-100">

    <!-- 頂部 Header -->
    <header class="bg-slate-950/80 backdrop-blur-md border-b border-slate-900 px-4 pb-3 flex items-center justify-between z-40">
        <div class="flex items-center gap-2">
            <div class="w-2.5 h-2.5 rounded-full bg-sky-500 animate-pulse"></div>
            <div>
                <h1 class="text-sm font-bold text-slate-100">115年南投縣髒亂點巡查系統</h1>
                <p id="sub-title" class="text-[10px] text-slate-500 font-mono">LOADING DATA...</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="toggleSettings(true)" class="w-8 h-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 active:scale-90 transition">
                <i class="ph ph-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- 分頁導覽 (分類切換) -->
    <nav class="bg-slate-950/80 backdrop-blur-md border-b border-slate-900 flex px-2 py-1.5 gap-1.5 z-40">
        <button id="btn-waste" onclick="switchCategory('waste')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition border border-transparent bg-sky-500/10 text-sky-400 border-sky-500/20">
            <i class="ph-fill ph-trash text-sm"></i>
            一般廢棄物
        </button>
        <button id="btn-tobacco" onclick="switchCategory('tobacco')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition border border-transparent text-slate-400 bg-slate-900/40">
            <i class="ph-fill ph-smoking text-sm"></i>
            菸蒂
        </button>
        <button id="btn-weed" onclick="switchCategory('weed')" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition border border-transparent text-slate-400 bg-slate-900/40">
            <i class="ph-fill ph-tree text-sm"></i>
            雜草案件
        </button>
    </nav>

    <!-- 地圖主容器 -->
    <div class="flex-1 relative z-10">
        <div id="map"></div>
        
        <!-- 快速浮動操作鈕 -->
        <div class="absolute right-4 bottom-6 z-[1000] flex flex-col gap-3">
            <!-- 重新載入數據按鈕 -->
            <button onclick="fetchCSVData(true)" class="w-12 h-12 rounded-2xl bg-slate-900/90 backdrop-blur border border-slate-800 shadow-2xl flex items-center justify-center text-slate-300 active:scale-90 transition">
                <i class="ph ph-arrows-clockwise text-xl"></i>
            </button>
            <!-- GPS 定位按鈕 -->
            <button id="locate-btn" onclick="locateUser()" class="w-12 h-12 rounded-2xl bg-slate-900/90 backdrop-blur border border-slate-800 shadow-2xl flex items-center justify-center text-sky-400 active:scale-90 transition">
                <i class="ph-fill ph-crosshair text-2xl"></i>
            </button>
        </div>
    </div>

    <!-- 點位詳情面板 (抽屜式) -->
    <div id="detail-panel" class="fixed left-0 right-0 bottom-0 z-[1050] bg-slate-950/95 backdrop-blur-xl border-t border-slate-900 rounded-t-[2rem] drawer-transition translate-y-full shadow-2xl p-6">
        <!-- 頂部拉條 -->
        <div class="w-12 h-1 bg-slate-800 rounded-full mx-auto mb-5 cursor-pointer" onclick="closeDetail()"></div>
        
        <div class="max-w-md mx-auto space-y-4">
            <!-- 標題與基礎資訊 -->
            <div class="flex justify-between items-start">
                <div>
                    <span id="detail-id" class="text-[10px] font-mono px-2 py-0.5 rounded bg-sky-500/10 text-sky-400 border border-sky-500/20">案件編號</span>
                    <h2 id="detail-title" class="text-base font-bold text-slate-100 mt-2">地點載入中...</h2>
                </div>
                <span id="detail-period-badge" class="text-xs font-bold px-3 py-1 rounded-xl bg-slate-900 border border-slate-800 text-slate-400">
                    H1 上半年
                </span>
            </div>

            <!-- 地理與使用資訊 -->
            <div class="grid grid-cols-2 gap-2 bg-slate-900/40 border border-slate-900 p-3.5 rounded-2xl text-xs">
                <div>
                    <span class="text-slate-500 text-[10px]">主管機關 / 權責單位</span>
                    <p id="detail-manager" class="text-slate-300 font-semibold mt-0.5">載入中...</p>
                </div>
                <div>
                    <span class="text-slate-500 text-[10px]">土地使用分區</span>
                    <p id="detail-landtype" class="text-slate-300 font-semibold mt-0.5">載入中...</p>
                </div>
            </div>

            <!-- 原地圖參考照片區塊 -->
            <div id="ref-photo-section" class="space-y-2">
                <h3 class="text-xs font-bold text-slate-400 flex items-center gap-1.5">
                    <i class="ph ph-image"></i> 原地圖參考照片
                </h3>
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="viewRefPhoto(1)" id="ref-photo-1-btn" class="flex items-center gap-2.5 bg-slate-900/40 hover:bg-slate-900/80 border border-slate-900 p-3 rounded-xl transition active:scale-95 text-left">
                        <i class="ph ph-image-square text-xl text-slate-500" id="ref-icon-1"></i>
                        <div>
                            <p class="text-xs font-semibold text-slate-300">地圖參考照片 1</p>
                            <p class="text-[9px] text-slate-500 mt-0.5">點擊開啟高畫質預覽</p>
                        </div>
                    </button>
                    <button onclick="viewRefPhoto(2)" id="ref-photo-2-btn" class="flex items-center gap-2.5 bg-slate-900/40 hover:bg-slate-900/80 border border-slate-900 p-3 rounded-xl transition active:scale-95 text-left">
                        <i class="ph ph-image-square text-xl text-slate-500" id="ref-icon-2"></i>
                        <div>
                            <p class="text-xs font-semibold text-slate-300">地圖參考照片 2</p>
                            <p class="text-[9px] text-slate-500 mt-0.5">點擊開啟高畫質預覽</p>
                        </div>
                    </button>
                </div>
            </div>

            <!-- 照片上傳回報欄位 -->
            <div id="photo-report-section" class="bg-slate-900/40 border border-slate-900 rounded-2xl p-4 space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-slate-400 flex items-center gap-1.5">
                        <i class="ph ph-camera"></i> 現場巡查拍攝
                    </h3>
                    <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoSelect(event)">
                    <button onclick="triggerCamera()" class="px-3.5 py-1.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs flex items-center gap-1 transition active:scale-95">
                        <i class="ph ph-aperture text-sm"></i> 點擊拍攝
                    </button>
                </div>
                
                <!-- 照片預覽容器 -->
                <div id="photo-preview-container" class="hidden relative rounded-xl overflow-hidden aspect-video border border-slate-800 bg-slate-950 flex items-center justify-center">
                    <img id="photo-preview-img" class="w-full h-full object-contain" src="">
                    <button onclick="cancelPhoto()" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-slate-950/80 border border-slate-800 flex items-center justify-center text-slate-300 active:scale-90 transition">
                        <i class="ph ph-x"></i>
                    </button>
                </div>

                <button id="upload-photo-btn" onclick="uploadPhoto()" class="hidden w-full py-3 rounded-xl bg-sky-500/10 hover:bg-sky-500/20 border border-sky-500/20 text-sky-400 font-bold text-xs transition active:scale-95 items-center justify-center gap-1.5">
                    <i class="ph ph-cloud-arrow-up text-sm"></i> 上傳照片並填寫 <span id="upload-period-text">【上半年】</span> 報表
                </button>
            </div>

            <!-- 下方快捷打卡按鈕 -->
            <div class="grid grid-cols-2 gap-3" id="normal-action-row">
                <button onclick="syncToGAS('update_status', '已改善')" class="py-3.5 rounded-2xl bg-cyan-600 hover:bg-cyan-500 text-slate-100 font-bold text-xs transition active:scale-95 shadow-lg flex items-center justify-center gap-1.5">
                    <i class="ph ph-check-circle text-base"></i> 巡查打卡 (已改善)
                </button>
                <button onclick="syncToGAS('update_status', '未改善')" class="py-3.5 rounded-2xl bg-slate-900 border border-slate-800 text-slate-400 font-bold text-xs transition active:scale-95 flex items-center justify-center gap-1.5">
                    <i class="ph ph-x-circle text-base"></i> 取消打卡 (清空)
                </button>
            </div>

            <div class="grid grid-cols-2 gap-3 hidden" id="weed-action-row">
                <button onclick="syncToGAS('update_status', '已結案')" class="py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-slate-100 font-bold text-xs transition active:scale-95 shadow-lg flex items-center justify-center gap-1.5">
                    <i class="ph ph-check-circle text-base"></i> 雜草已結案
                </button>
                <button onclick="syncToGAS('update_status', '未處理')" class="py-3.5 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-400 font-bold text-xs transition active:scale-95 flex items-center justify-center gap-1.5">
                    <i class="ph ph-x-circle text-base"></i> 雜草未處理
                </button>
            </div>

            <button onclick="openGoogleMapNavigation()" class="w-full py-3.5 rounded-2xl bg-[#1e293b] hover:bg-slate-800 text-slate-300 border border-slate-800 font-bold text-xs transition active:scale-95 shadow-lg flex items-center justify-center gap-1.5">
                <i class="ph ph-navigation-arrow text-base text-sky-400"></i> 開啟 Google Maps 導航
            </button>
        </div>
    </div>

    <!-- 設定側邊欄 -->
    <div id="settings-sidebar" class="fixed inset-y-0 right-0 z-[1500] w-full max-w-sm bg-slate-950 border-l border-slate-900 p-6 shadow-2xl drawer-transition translate-x-full flex flex-col justify-between">
        <div class="space-y-6">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-slate-100">系統核心連線設定</h2>
                <button onclick="toggleSettings(false)" class="w-8 h-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-400 active:scale-90 transition">
                    <i class="ph ph-x"></i>
                </button>
            </div>

            <!-- GAS 連線設定 -->
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-slate-400">Google GAS 網頁應用程式 URL</label>
                <input type="text" id="gas-url-input" class="w-full text-xs font-mono px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:border-sky-500 text-slate-200" placeholder="https://script.google.com/macros/s/.../exec">
                <p class="text-[10px] text-slate-500 leading-relaxed">※ 請將 Google Apps Script 部署為網頁應用程式，設定「任何人 (Anyone)」皆可存取並將網址填於此處。</p>
            </div>

            <!-- 期別選擇 -->
            <div class="space-y-2">
                <label class="block text-xs font-semibold text-slate-400">預設巡查期別</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center justify-center border border-slate-800 rounded-xl p-3 cursor-pointer has-[:checked]:border-sky-500 has-[:checked]:bg-sky-500/10 transition">
                        <input type="radio" name="settings-period" value="H1" checked onchange="saveSettings()" class="sr-only">
                        <span class="text-xs font-bold text-slate-300">115 上半年度</span>
                    </label>
                    <label class="flex items-center justify-center border border-slate-800 rounded-xl p-3 cursor-pointer has-[:checked]:border-sky-500 has-[:checked]:bg-sky-500/10 transition">
                        <input type="radio" name="settings-period" value="H2" onchange="saveSettings()" class="sr-only">
                        <span class="text-xs font-bold text-slate-300">115 下半年度</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="space-y-3">
            <button onclick="saveSettings(); toggleSettings(false);" class="w-full py-3.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs transition active:scale-95 flex items-center justify-center gap-1.5">
                <i class="ph ph-floppy-disk"></i> 儲存設定並關閉
            </button>
            <p class="text-[10px] text-slate-600 text-center font-mono">115 TOUTOU SANITATION APP V7.0</p>
        </div>
    </div>

    <!-- 同步失敗彈窗 -->
    <div id="error-modal" class="hidden fixed inset-0 z-[2000] flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl relative">
            <div class="flex items-start gap-3">
                <div class="bg-rose-500/10 border border-rose-500/20 p-2 rounded-xl text-rose-500">
                    <i class="ph-fill ph-warning-octagon text-2xl"></i>
                </div>
                <div class="flex-1">
                    <h3 class="text-sm font-bold text-slate-100">同步被拒絕</h3>
                    <p id="error-modal-msg" class="text-xs text-slate-400 mt-1.5 leading-relaxed whitespace-pre-line"></p>
                </div>
            </div>
            
            <div class="mt-5 flex gap-3">
                <button onclick="closeErrorModal()" class="flex-1 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold transition active:scale-95">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- 全局 Loading 遮罩層 -->
    <div id="loading-mask" class="hidden fixed inset-0 z-[5000] bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center gap-3">
        <div class="loading-spinner"></div>
        <p id="loading-mask-text" class="text-xs text-sky-400 font-mono tracking-wider">LOADING...</p>
    </div>

    <!-- 全局 Toast 提示 -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[9999] pointer-events-none flex flex-col gap-2 w-full max-w-xs px-4"></div>

    <!-- PWA 快取與地圖設定 & 核心邏輯 -->
    <script>
        // 115年南投縣髒亂點 CSV 資料源定義 (Github 託管的最新資料)
        const csvUrls = {
            waste: "https://raw.githubusercontent.com/Anson8811/Nantou-County-Trash-Map/main/%E4%B8%80%E3%80%81%E7%92%B0%E5%A2%83%E8%A1%9B%E7%94%9F%20(2).xlsx%20-%20115%E5%B9%B4%E4%B8%80%E8%88%AC%E5%BB%A2%E6%A3%84%E7%89%A9.csv",
            tobacco: "https://raw.githubusercontent.com/Anson8811/Nantou-County-Trash-Map/main/%E4%B8%80%E3%80%81%E7%92%B0%E5%A2%83%E8%A1%9B%E7%94%9F%20(2).xlsx%20-%20115%E5%B9%B4%E8%8F%B8%E8%92%82.csv",
            weed: "https://raw.githubusercontent.com/Anson8811/Nantou-County-Trash-Map/main/%E4%B8%80%E3%80%81%E7%92%B0%E5%A2%83%E8%A1%9B%E7%94%9F%20(2).xlsx%20-%20115%E5%B9%B4%E9%9B%9C%E8%8D%89%E6%A1%88%E4%BB%B6.csv"
        };

        let map, markerGroup;
        let currentCategory = 'waste'; // waste, tobacco, weed
        let currentPeriod = 'H1';      // H1, H2
        let csvRawData = { waste: [], tobacco: [], weed: [] };
        let activePoint = null;
        let userMarker = null;

        // PWA 功能初始化 - 使用 URL 安全的 UTF-8 位元組轉 Base64 處理中文字元
        const manifest = {
            "name": "115年南投縣髒亂點巡查系統",
            "short_name": "髒亂點巡檢",
            "start_url": window.location.href,
            "display": "standalone",
            "background_color": "#020617",
            "theme_color": "#020617",
            "icons": [
                { "src": "https://cdn-icons-png.flaticon.com/512/2855/2855541.png", "sizes": "192x192", "type": "image/png" },
                { "src": "https://cdn-icons-png.flaticon.com/512/2855/2855541.png", "sizes": "512x512", "type": "image/png" }
            ]
        };
        // 修正 btoa 無法直接處理非 Latin1 (中文字元) 範圍字串的問題
        const base64Manifest = btoa(unescape(encodeURIComponent(JSON.stringify(manifest))));
        document.getElementById('dynamic-manifest').setAttribute('href', 'data:application/manifest+json;base64,' + base64Manifest);

        // 地圖初始化
        function initMap() {
            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                fadeAnimation: true,
                zoomAnimation: true
            }).setView([23.908, 120.685], 13); // 預設聚焦南投市

            // 套用 CartoDB Dark Matter 尊爵深色地圖底圖
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                maxZoom: 20
            }).addTo(map);

            markerGroup = L.layerGroup().addTo(map);
            
            // 地圖點擊事件：關閉點位 Drawer
            map.on('click', () => {
                closeDetail();
            });
        }

        // 讀取設定檔
        function loadSettings() {
            const savedUrl = localStorage.getItem('gas_url');
            if (savedUrl) {
                document.getElementById('gas-url-input').value = savedUrl;
            }
            const savedPeriod = localStorage.getItem('period');
            if (savedPeriod) {
                currentPeriod = savedPeriod;
                const radios = document.getElementsByName('settings-period');
                radios.forEach(r => r.checked = (r.value === savedPeriod));
            }
            updatePeriodDisplay();
        }

        function saveSettings() {
            const gasUrl = document.getElementById('gas-url-input').value.trim();
            localStorage.setItem('gas_url', gasUrl);
            
            const selectedRadio = document.querySelector('input[name="settings-period"]:checked');
            if (selectedRadio) {
                currentPeriod = selectedRadio.value;
                localStorage.setItem('period', currentPeriod);
            }
            updatePeriodDisplay();
            renderMarkers(); // 重新整理地圖上的圖示（因為期別可能更動影響完工狀態）
            
            // 重新整理詳細面板中的上傳期別提示
            const periodText = document.getElementById('upload-period-text');
            if(periodText) {
                periodText.innerText = currentPeriod === 'H1' ? '【上半年】' : '【下半年】';
            }
        }

        function updatePeriodDisplay() {
            const badge = document.getElementById('detail-period-badge');
            if(badge) {
                badge.innerText = currentPeriod === 'H1' ? 'H1 上半年' : 'H2 下半年';
            }
            const subTitle = document.getElementById('sub-title');
            if (subTitle && csvRawData[currentCategory].length > 0) {
                subTitle.innerText = `${currentCategory === 'waste' ? '🗑️ 一般廢棄物' : (currentCategory === 'tobacco' ? '🚭 菸蒂' : '🌿 雜草案件')} / 總數: ${csvRawData[currentCategory].length} 筆`;
            }
        }

        function toggleSettings(show) {
            const sidebar = document.getElementById('settings-sidebar');
            if (show) {
                sidebar.classList.remove('translate-x-full');
            } else {
                sidebar.classList.add('translate-x-full');
            }
        }

        // 切換資料類別
        function switchCategory(category) {
            currentCategory = category;
            
            const tabs = { waste: 'btn-waste', tobacco: 'btn-tobacco', weed: 'btn-weed' };
            Object.keys(tabs).forEach(k => {
                const btn = document.getElementById(tabs[k]);
                if (k === category) {
                    btn.className = `flex-1 py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition border border-transparent ${
                        k === 'waste' ? 'bg-sky-500/10 text-sky-400 border-sky-500/20' : 
                        (k === 'tobacco' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20')
                    }`;
                } else {
                    btn.className = "flex-1 py-2 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition border border-transparent text-slate-400 bg-slate-900/40";
                }
            });

            // 控制 Drawer 內的打卡按鈕顯示狀態
            const normalRow = document.getElementById('normal-action-row');
            const weedRow = document.getElementById('weed-action-row');
            if (category === 'weed') {
                normalRow.classList.add('hidden');
                weedRow.classList.remove('hidden');
                document.getElementById('detail-period-badge').classList.add('hidden');
                document.getElementById('photo-report-section').classList.add('hidden'); // 雜草案件依需求關閉照片
            } else {
                normalRow.classList.remove('hidden');
                weedRow.classList.add('hidden');
                document.getElementById('detail-period-badge').classList.remove('hidden');
                document.getElementById('photo-report-section').classList.remove('hidden');
            }

            closeDetail();
            updatePeriodDisplay();
            
            if (csvRawData[category].length === 0) {
                fetchCSVData();
            } else {
                renderMarkers();
            }
        }

        // 🟢 智慧洗滌器（與後端 100% 同步洗滌邏輯）
        function cleanString(str) {
            if (!str) return "";
            return str.toString()
                      .replace(/\uFEFF/g, '') // 粉碎隱形 BOM 字元
                      .replace(/[\u200B-\u200D\u200E\u200F\uFEFF]/g, '')
                      .replace(/\s+/g, '')
                      .replace(/[-_－—\/\\#+]/g, '')
                      .toLowerCase();
        }

        // 讀取網路 CSV 資料 (具備離線快取防斷網功能)
        async function fetchCSVData(forceRefresh = false) {
            showLoading("讀取巡查點位數據中...");
            const cacheKey = `csv_cache_115_${currentCategory}`;
            const cached = localStorage.getItem(cacheKey);

            if (!forceRefresh && cached) {
                csvRawData[currentCategory] = JSON.parse(cached);
                renderMarkers();
                hideLoading();
                updatePeriodDisplay();
                return;
            }

            try {
                const response = await fetch(csvUrls[currentCategory], { cache: "no-store" });
                const text = await response.text();
                const parsed = parseCSV(text);
                
                if (parsed.length > 0) {
                    csvRawData[currentCategory] = parsed;
                    localStorage.setItem(cacheKey, JSON.stringify(parsed));
                    renderMarkers();
                    showToast(`🟢 成功獲取最新 ${parsed.length} 筆巡查數據！`, "success");
                } else {
                    showToast("❌ 解析點位數據失敗，請確認資料結構。", "error");
                }
            } catch (error) {
                if (cached) {
                    csvRawData[currentCategory] = JSON.parse(cached);
                    renderMarkers();
                    showToast("⚠️ 無法連線網路。已為您載入本機離線數據！", "warning");
                } else {
                    showToast("❌ 無法連線上網且無離線快取資料，請檢查網路！", "error");
                }
            } finally {
                hideLoading();
                updatePeriodDisplay();
            }
        }

        // CSV 分析核心 (智慧偵測標題列並進行標題去 BOM 清理)
        function parseCSV(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
            if (lines.length === 0) return [];

            // 1. 智慧尋找標題列 Row Index
            let headerIndex = 2; // 預設第 3 行 (Index 2)
            const keywords = ['案件數', '案件編號', '編號', '序號', '地段', '地號', '地點', '鄉鎮市', '行政區'];
            
            for (let i = 0; i < Math.min(10, lines.length); i++) {
                const cols = lines[i].split(',').map(c => cleanString(c));
                if (cols.length >= 3 && keywords.some(k => cols.indexOf(cleanString(k)) !== -1)) {
                    headerIndex = i;
                    break;
                }
            }

            // 2. 清理 Header，強制抹除隱形 BOM (\uFEFF)
            const headers = lines[headerIndex].split(',').map(h => h.trim().replace(/^\uFEFF/, ''));
            const results = [];

            // 3. 填入點位資料
            for (let i = headerIndex + 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length < headers.length) continue;
                
                const item = {};
                headers.forEach((h, index) => {
                    item[h] = cols[index] ? cols[index].trim() : "";
                });
                
                // 必須含有經緯度數值才加入
                if (item['緯度'] && item['經度'] && !isNaN(parseFloat(item['緯度']))) {
                    results.push(item);
                }
            }
            return results;
        }

        // 渲染地圖圖標 (Marker)
        function renderMarkers() {
            markerGroup.clearLayers();
            const points = csvRawData[currentCategory];

            points.forEach(point => {
                const lat = parseFloat(point['緯度']);
                const lng = parseFloat(point['經度']);
                if (isNaN(lat) || isNaN(lng)) return;

                // 智慧判定打卡完成狀態
                let isDone = false;
                if (currentCategory === 'weed') {
                    // 雜草案件判定
                    const progress = cleanString(point['目前處理進度']);
                    isDone = (progress.indexOf('已結案') !== -1 || progress.indexOf('改善') !== -1 || progress.indexOf('done') !== -1);
                } else {
                    // 廢棄物與菸蒂：判定 H1 / H2 複檢期是否有內容
                    const dateCol = currentPeriod === 'H1' ? 
                        (point['115上半年度-複檢期'] || point['115上半年度複檢期'] || point['H1日期']) : 
                        (point['115下半年度-複檢期'] || point['115下半年度複檢期'] || point['H2日期']);
                    isDone = (dateCol && dateCol.trim() !== "");
                }

                // 依據完成狀態套用不同色系與精緻 SVG 圖標
                const iconColor = isDone ? '#10b981' : (currentCategory === 'waste' ? '#06b6d4' : (currentCategory === 'tobacco' ? '#f59e0b' : '#10b981'));
                const iconHtml = `
                    <div style="position: relative; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
                        <div style="position: absolute; width: 100%; height: 100%; background: ${iconColor}; opacity: 0.15; border-radius: 50%; border: 1px solid ${iconColor};"></div>
                        <div style="width: 14px; height: 14px; background: ${iconColor}; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.4);"></div>
                    </div>
                `;

                const markerIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: iconHtml,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16]
                });

                const marker = L.marker([lat, lng], { icon: markerIcon });
                
                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    showDetail(point);
                });

                markerGroup.addLayer(marker);
            });
        }

        // 開啟詳情 Drawer
        function showDetail(point) {
            activePoint = point;
            
            document.getElementById('detail-id').innerText = `案件數: ${point['案件數'] || point['編號'] || 'N/A'}`;
            document.getElementById('detail-title').innerText = point['地點/地號'] || point['地點'] || point['地段'] || '無地點標示';
            document.getElementById('detail-manager').innerText = point['權責單位'] || '無主管機關登錄';
            document.getElementById('detail-landtype').innerText = point['使用分區'] || '私有地';

            // 處理參考照片按鈕 (1 與 2)
            const photo1 = point['照片'] || point['地圖參考照片1'] || point['現場照片'] || '';
            const photo2 = point['地圖參考照片2'] || '';
            
            setupRefPhotoBtn('ref-photo-1-btn', 'ref-icon-1', photo1);
            setupRefPhotoBtn('ref-photo-2-btn', 'ref-icon-2', photo2);

            if (!photo1 && !photo2) {
                document.getElementById('ref-photo-section').classList.add('hidden');
            } else {
                document.getElementById('ref-photo-section').classList.remove('hidden');
            }

            // 關閉先前的預覽相片
            cancelPhoto();

            // 滑動出 Drawer
            const panel = document.getElementById('detail-panel');
            panel.classList.remove('translate-y-full');
            
            // 地圖稍微偏位，讓 Drawer 不會擋住 Marker
            map.panTo([parseFloat(point['緯度']) - 0.002, parseFloat(point['經度'])], { animate: true });
        }

        function setupRefPhotoBtn(btnId, iconId, url) {
            const btn = document.getElementById(btnId);
            const icon = document.getElementById(iconId);
            if (url && url.trim() !== "") {
                btn.classList.remove('hidden');
                btn.onclick = () => window.open(url, '_blank');
                icon.className = "ph-fill ph-image text-xl text-sky-400";
            } else {
                btn.classList.add('hidden');
            }
        }

        function closeDetail() {
            const panel = document.getElementById('detail-panel');
            panel.classList.add('translate-y-full');
            activePoint = null;
        }

        // 📸 照相與預覽邏輯
        function triggerCamera() {
            document.getElementById('camera-input').click();
        }

        function handlePhotoSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('photo-preview-img').src = e.target.result;
                    document.getElementById('photo-preview-container').classList.remove('hidden');
                    document.getElementById('upload-photo-btn').classList.remove('hidden');
                    document.getElementById('upload-photo-btn').style.display = 'flex';
                };
                reader.readAsDataURL(file);
            }
        }

        function cancelPhoto() {
            document.getElementById('camera-input').value = "";
            document.getElementById('photo-preview-img').src = "";
            document.getElementById('photo-preview-container').classList.add('hidden');
            document.getElementById('upload-photo-btn').classList.add('hidden');
            document.getElementById('upload-photo-btn').style.display = 'none';
        }

        // 🎯 核心更新：同步數據至試算表 (打卡)
        async function syncToGAS(action, statusText = '') {
            const gasUrl = localStorage.getItem('gas_url');
            if (!gasUrl) {
                showToast("❌ 請先至設定中填寫後端 API 網址！", "error");
                toggleSettings(true);
                return;
            }
            if (!activePoint) {
                showToast("❌ 請先選取巡查點位！", "error");
                return;
            }

            showLoading("正在同步數據至雲端試算表...");

            try {
                // 📐 核心 V7.0 經緯度讀取 (將點位原本的靜態經緯度精準打包)
                const latVal = parseFloat(activePoint['緯度'] || activePoint['lat'] || activePoint['latitude'] || 0);
                const lngVal = parseFloat(activePoint['經度'] || activePoint['lng'] || activePoint['longitude'] || 0);

                const payload = {
                    action: action,
                    category: currentCategory === 'waste' ? '一般廢棄物' : (currentCategory === 'tobacco' ? '菸蒂' : '雜草'),
                    period: currentCategory === 'weed' ? 'None' : currentPeriod,
                    itemId: activePoint['案件數'] || activePoint['案件編號'] || activePoint['編號'] || '',
                    status: statusText,
                    latitude: latVal,
                    longitude: lngVal
                };

                const response = await fetch(gasUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                hideLoading();

                if (result.status === 'success') {
                    showToast("🟢 " + result.message, "success");
                    
                    // 動態更新本地快取狀態 (不需重新載入整個 CSV)
                    updateLocalCacheStatus(statusText);
                    closeDetail();
                } else {
                    showToast("❌ 同步失敗：" + result.message, "error");
                    showErrorModal(result.message);
                }
            } catch (error) {
                hideLoading();
                showToast("❌ 連線異常，請檢查網路或 GAS 設定！", "error");
            }
        }

        // 🎯 核心更新：拍照並上傳雲端硬碟 (連同 GPS)
        async function uploadPhoto() {
            const gasUrl = localStorage.getItem('gas_url');
            if (!gasUrl) {
                showToast("❌ 請先至設定中填寫後端 API 網址！", "error");
                toggleSettings(true);
                return;
            }
            if (!activePoint) {
                showToast("❌ 請先選取巡查點位！", "error");
                return;
            }

            const fileInput = document.getElementById('camera-input');
            const file = fileInput.files[0];
            if (!file) {
                showToast("⚠️ 請先拍照或選取照片！", "error");
                return;
            }

            showLoading("正在壓縮並上傳照片...");

            try {
                const base64Data = await getBase64(file);
                const cleanBase64 = base64Data.split(',')[1];
                
                // 📐 核心 V7.0 經緯度讀取
                const latVal = parseFloat(activePoint['緯度'] || activePoint['lat'] || activePoint['latitude'] || 0);
                const lngVal = parseFloat(activePoint['經度'] || activePoint['lng'] || activePoint['longitude'] || 0);

                const payload = {
                    action: 'upload_photo',
                    category: currentCategory === 'waste' ? '一般廢棄物' : (currentCategory === 'tobacco' ? '菸蒂' : '雜草'),
                    period: currentCategory === 'weed' ? 'None' : currentPeriod,
                    itemId: activePoint['案件數'] || activePoint['案件編號'] || activePoint['編號'] || '',
                    base64: cleanBase64,
                    mimeType: file.type,
                    filename: `${activePoint['案件數'] || 'photo'}_${currentPeriod}_${Date.now()}.jpg`,
                    latitude: latVal,
                    longitude: lngVal
                };

                const response = await fetch(gasUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                hideLoading();

                if (result.status === 'success') {
                    showToast("🟢 " + result.message, "success");
                    updateLocalCacheStatus('已改善'); // 照片上傳等同打卡完成
                    closeDetail();
                } else {
                    showToast("❌ 上傳失敗：" + result.message, "error");
                    showErrorModal(result.message);
                }
            } catch (error) {
                hideLoading();
                showToast("❌ 照片上傳失敗，請檢查網路或檔案大小！", "error");
            }
        }

        // 更新本地快取，打卡完即時在地圖變色
        function updateLocalCacheStatus(statusText) {
            const cacheKey = `csv_cache_115_${currentCategory}`;
            const targetId = activePoint['案件數'] || activePoint['編號'];
            
            // 產生今天的民國紀年日期字串 (例如：115.06.03)
            const now = new Date();
            const year = now.getFullYear() - 1911;
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}.${month}.${day}`;

            csvRawData[currentCategory] = csvRawData[currentCategory].map(item => {
                if ((item['案件數'] || item['編號']) === targetId) {
                    if (currentCategory === 'weed') {
                        item['目前處理進度'] = statusText;
                    } else {
                        const dateField = currentPeriod === 'H1' ? '115上半年度-複檢期' : '115下半年度-複檢期';
                        item[dateField] = (statusText.indexOf('未') !== -1) ? "" : dateStr;
                    }
                }
                return item;
            });

            localStorage.setItem(cacheKey, JSON.stringify(csvRawData[currentCategory]));
            renderMarkers(); // 重新整理
        }

        // 讀取檔案轉為 Base64
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // 開啟 Google 地圖導航
        function openGoogleMapNavigation() {
            if (!activePoint) return;
            const lat = activePoint['緯度'];
            const lng = activePoint['經度'];
            const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
            window.open(url, '_blank');
        }

        // 📌 手機 GPS 定位與地圖追蹤
        function locateUser() {
            const btnIcon = document.querySelector('#locate-btn i');
            if(btnIcon) btnIcon.className = "ph ph-spinner animate-spin text-2xl text-sky-400"; 
            if (!navigator.geolocation) return showToast("❌ 您的手機或瀏覽器不支援 GPS 定位功能！", "error");
            
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude, lng = pos.coords.longitude;
                    if (userMarker && map) map.removeLayer(userMarker);
                    if (map) {
                        userMarker = L.marker([lat, lng], { icon: L.divIcon({ className: 'custom-user-icon', html: `<div class="relative"><div class="user-pulse"></div><div class="user-location-marker"></div></div>`, iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 }).addTo(map);
                        map.flyTo([lat, lng], 16, { animate: true, duration: 1.5 });
                        showToast("📍 已成功獲取當前高精準度位置！", "success");
                    }
                    if(btnIcon) btnIcon.className = "ph-fill ph-crosshair text-2xl text-sky-400"; 
                },
                () => { 
                    showToast("❌ GPS 定位失敗，請確認已在手機系統設定中開啟定位與授權！", "error"); 
                    if(btnIcon) btnIcon.className = "ph-fill ph-crosshair text-2xl text-sky-400";
                },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        }

        // UI 遮罩
        function showLoading(text) {
            document.getElementById('loading-mask-text').innerText = text.toUpperCase();
            document.getElementById('loading-mask').classList.remove('hidden');
        }
        function hideLoading() {
            document.getElementById('loading-mask').classList.add('hidden');
        }

        // 同步被拒絕彈窗控制
        function showErrorModal(message) {
            document.getElementById('error-modal-msg').innerText = message;
            document.getElementById('error-modal').classList.remove('hidden');
        }
        function closeErrorModal() {
            document.getElementById('error-modal').classList.add('hidden');
        }

        // Toast 顯示器
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = "bg-slate-900 border-slate-800 text-slate-100";
            if (type === 'success') bgClass = "bg-emerald-950/90 border-emerald-500/20 text-emerald-400";
            if (type === 'error') bgClass = "bg-rose-950/90 border-rose-500/20 text-rose-400";
            if (type === 'warning') bgClass = "bg-amber-950/90 border-amber-500/20 text-amber-400";

            toast.className = `p-4 rounded-2xl border shadow-2xl text-xs font-bold leading-relaxed flex items-center gap-2.5 transition-all duration-300 translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = message;

            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 50);

            setTimeout(() => {
                toast.classList.add('translate-y-[-10px]', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // 系統啟動
        window.onload = () => {
            initMap();
            loadSettings();
            fetchCSVData();
        };
    </script>
